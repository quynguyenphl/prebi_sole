<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Ludwigsburg School Collaborations Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/MarkerCluster.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/MarkerCluster.Default.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 

</head>
<body>
        <div class="container">
            <header>
                <h1>PH Ludwigsburg - Kooperationspartner-Karte</h1>
                <p>Interaktive Karte der Partnereinrichtungen und Kooperationen</p>
            </header>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Suche nach Namen, Adresse, Angebot..." aria-label="Suchfeld">
                <div class="search-actions">
                    <button id="clearSearch" aria-label="Suchfeld löschen">Löschen</button>
                    <button id="exportBtn" class="action-btn export-btn" aria-label="Ergebnisse als CSV exportieren" title="Als CSV exportieren">Exportieren</button>
                    <button id="shareBtn" class="action-btn share-btn" aria-label="Ergebnisse teilen" title="Link teilen">Teilen</button>
                </div>
            </div>
            <div class="main-layout">
                <aside class="filter-sidebar">
                    <div class="filter-box">
                        <h3>Filter nach Kategorie</h3>
                        <div class="filter-options">
                            <!-- Dynamically populated by script.js -->
                        </div>
                    </div>

                    <div class="filter-box">
                        <h3>Filter nach SoLE-Kooperation</h3>
                        <div class="cooperation-filter-options">
                            <!-- Dynamically populated by script.js -->
                        </div>
                    </div>

                    <div class="filter-controls">
                        <button id="clearFilters" class="clear-filters-btn">Alle Filter zurücksetzen</button>
                    </div>
                </aside>

                <main class="map-panel">
                    <div id="map"></div>
                </main>
            </div>
        <div class="results-section">
            <h3>Filterergebnisse</h3>
            <div id="resultsList" class="results-list"></div>
        </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/leaflet.markercluster.min.js"></script>
    
    <!-- Custom Scripts -->
    <!-- <script src="data.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
