<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Ludwigsburg School Collaborations Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/MarkerCluster.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/MarkerCluster.Default.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>PH Ludwigsburg - School Collaborations</h1>
            <p>Partner schools and collaboration events</p>
        </header>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search schools...">
            <button id="clearSearch">Clear</button>
        </div>
        
        <div id="map"></div>
        
        <div class="legend">
            <h3>Legend</h3>
            <div class="legend-item">
                <span class="legend-marker primary"></span>
                <span>Primary School</span>
            </div>
            <div class="legend-item">
                <span class="legend-marker secondary"></span>
                <span>Secondary School</span>
            </div>
            <div class="legend-item">
                <span class="legend-marker gymnasium"></span>
                <span>Gymnasium</span>
            </div>
            <div class="legend-item">
                <span class="legend-marker vocational"></span>
                <span>Vocational School</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/leaflet.markercluster.min.js"></script>
    
    <!-- Custom Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
